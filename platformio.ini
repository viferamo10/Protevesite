; PROTEVE FW-S3-MVP-001 — ESP32-S3 N16R8 (Sixspan, USB-C inferior nativo)
[env:proteve_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    -DPROTEVE_FW_ID=\"FW-S3-MVP-001\"
    -DPROTEVE_FW_VERSION=\"0.1.0-dev\"
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    mandulaj/PZEM-004T-v30@^1.1.2   ; PZEM004Tv30 — mesma lib usada no V11.9 (CHG-20260906-003)
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.6
    adafruit/RTClib@^2.1.4
    plerup/EspSoftwareSerial@^8.2.0   ; candidato A (ADR-002) para PZEM-3
