        <h1>PROTEVE — Inteligência Operacional</h1>
        <p>Inteligência para entender, proteger e operar. A PROTEVE conecta energia, sensores, telemetria e comportamento numa única camada de inteligência — monitora, analisa, identifica mudanças e pode alertar, automatizar e agir conforme as regras configuradas.</p>
        <h2>Como funciona</h2>
        <p>1. Nós instalamos: um técnico da nossa equipe instala os sensores no seu quadro e nos equipamentos que importam.<br>
        2. O sistema aprende: em poucos dias, ele conhece o normal da sua propriedade — quanto gasta a geladeira, quando liga o compressor, como se comporta a energia.<br>
        3. Você é avisado: quando algo sai do normal, o Telegram chega na hora — e só quando é para valer. Você resolve antes do prejuízo.</p>
        <h2>Aplicações</h2>
        <p>Casa · Rancho · Fazenda · Indústria e Comércio. Cercas elétricas, câmaras frias, bombas, compressores, portões e quadros monitorados com histórico local e auditável. A PROTEVE nunca substitui a proteção elétrica: disjuntor, DPS, terra e hardware homologado continuam soberanos.</p>
